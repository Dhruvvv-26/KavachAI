version: "3.9"

# KavachAI — Production Docker Compose (Direct Image Pull)
# Use this when deploying directly onto a VPS, EC2, or standard Linux Server without building from source.

networks:
  kavachai-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  redpanda-data:

x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: kavachai
  DB_USER: kavachai
  DB_PASSWORD: ${DB_PASSWORD:-kavachai_secure_2026}
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_2026}@redis:6379/0
  REDPANDA_BROKERS: redpanda:9092
  WORKER_SERVICE_URL: http://worker-service:8001
  POLICY_SERVICE_URL: http://policy-service:8002
  CLAIMS_SERVICE_URL: http://claims-service:8004
  PAYMENT_SERVICE_URL: http://payment-service:8005
  ML_SERVICE_URL: http://ml-service:8006
  LOG_LEVEL: INFO
  ENV: production

services:
  # Infrastructure
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: kavachai
      POSTGRES_USER: kavachai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kavachai_secure_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - kavachai-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - kavachai-net

  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --smp=1
      - --memory=512M
      - --mode=dev-container
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "19092:19092"
      - "18082:18082"
    restart: unless-stopped
    networks:
      - kavachai-net

  # Microservices (Replace REPOSITORY_USER with your Docker Hub username)
  worker-service:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-worker-service:latest
    container_name: worker-service
    environment:
      <<: *common-env
      SERVICE_NAME: worker-service
      SERVICE_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on: [postgres, redis]
    restart: unless-stopped
    networks:
      - kavachai-net

  policy-service:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-policy-service:latest
    container_name: policy-service
    environment:
      <<: *common-env
      SERVICE_NAME: policy-service
      SERVICE_PORT: "8002"
    ports:
      - "8002:8002"
    depends_on: [postgres, redis, worker-service]
    restart: unless-stopped
    networks:
      - kavachai-net

  trigger-engine:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-trigger-engine:latest
    container_name: trigger-engine
    environment:
      <<: *common-env
      SERVICE_NAME: trigger-engine
      SERVICE_PORT: "8003"
      OWM_API_KEY: ${OWM_API_KEY:-demo_key}
      CPCB_API_KEY: ${CPCB_API_KEY:-demo_key}
      TRIGGER_POLL_INTERVAL_MINUTES: "15"
    ports:
      - "8003:8003"
    depends_on: [postgres, redis, redpanda]
    restart: unless-stopped
    networks:
      - kavachai-net

  claims-service:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-claims-service:latest
    container_name: claims-service
    environment:
      <<: *common-env
      SERVICE_NAME: claims-service
      SERVICE_PORT: "8004"
    ports:
      - "8004:8004"
    depends_on: [postgres, redis, redpanda]
    restart: unless-stopped
    networks:
      - kavachai-net

  payment-service:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-payment-service:latest
    container_name: payment-service
    environment:
      <<: *common-env
      SERVICE_NAME: payment-service
      SERVICE_PORT: "8005"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-demo_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-demo_key}
      FCM_DISPATCH_ENABLED: "false"
    ports:
      - "8005:8005"
    depends_on: [postgres, redis, redpanda]
    restart: unless-stopped
    networks:
      - kavachai-net

  ml-service:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-ml-service:latest
    container_name: ml-service
    environment:
      <<: *common-env
      SERVICE_NAME: ml-service
      SERVICE_PORT: "8006"
      MODEL_DIR: /app/ml/models
    ports:
      - "8006:8006"
    depends_on: [postgres, redis]
    restart: unless-stopped
    networks:
      - kavachai-net

  admin-dashboard:
    image: ${REPOSITORY_USER:-kavachai}/kavachai-admin-dashboard:latest
    container_name: admin-dashboard
    environment:
      - VITE_WORKER_URL=/api/worker
      - VITE_POLICY_URL=/api/policy
      - VITE_TRIGGER_URL=/api/trigger
      - VITE_CLAIMS_URL=/api/claims
      - VITE_PAYMENT_URL=/api/payment
      - VITE_ML_URL=/api/ml
      - VITE_DEMO_MODE=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - kavachai-net
